<div class="container">
  <mat-card class="card">
    <mat-card-header>
      <mat-card-title>Criar Novo Produto</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="produtoForm" (ngSubmit)="onSubmit()" novalidate>
        <div class="form-content">
          <!-- descricao -->
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Descrição</mat-label>
            <input
              matInput
              type="text"
              id="descricao"
              formControlName="descricao"
              placeholder="Ex: Coca-Cola 350ml"
            />
            <mat-error
              *ngIf="
                descricao.invalid && (descricao.dirty || descricao.touched)
              "
            >
              <span *ngIf="descricao.errors?.['required']"
                >Descrição é obrigatória</span
              >
              <span *ngIf="descricao.errors?.['minlength']"
                >Mínimo de 3 caracteres</span
              >
            </mat-error>
          </mat-form-field>

          <!-- preco -->
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Preço</mat-label>
            <input
              matInput
              id="preco"
              formControlName="preco"
              step="0.01"
              appCurrencyMask
              type="text"
              inputmode="decimal"
            />
            <mat-error *ngIf="preco.invalid && (preco.dirty || preco.touched)">
              <span *ngIf="preco.errors?.['required']"
                >Preço é obrigatório</span
              >
              <span *ngIf="preco.errors?.['min']"
                >O preço não pode ser negativo</span
              >
            </mat-error>
          </mat-form-field>

          <!-- numero -->
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Número</mat-label>
            <input
              matInput
              type="number"
              id="numero"
              formControlName="numero"
            />
            <mat-error
              *ngIf="numero.invalid && (numero.dirty || numero.touched)"
            >
              <span *ngIf="numero.errors?.['required']"
                >Número é obrigatório</span
              >
              <span *ngIf="numero.errors?.['min']"
                >O número não pode ser negativo</span
              >
            </mat-error>
          </mat-form-field>

          <!-- checkbox -->
          <div class="checkboxes">
            <mat-checkbox formControlName="ativo" class="checkbox-item">
              Ativo
            </mat-checkbox>

            <mat-checkbox formControlName="adicional" class="checkbox-item">
              Adicional
            </mat-checkbox>
          </div>

          <!-- botão -->
          <div class="button-group">
            <button
              mat-raised-button
              color="primary"
              type="submit"
              [disabled]="isLoading || produtoForm.invalid"
              class="submit-button"
            >
              <mat-spinner
                diameter="20"
                *ngIf="isLoading"
                class="spinner"
              ></mat-spinner>
              {{ isLoading ? "Salvando..." : "Salvar" }}
            </button>
          </div>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
