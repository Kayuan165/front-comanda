<section class="produto-list">
  <div class="status-message" *ngIf="loading">Carregando produtos...</div>
  <div class="status-message error" *ngIf="error">{{ error }}</div>

  <div class="produtos-container" *ngIf="!loading && !error">
    <div class="produto-card" *ngFor="let produto of produtos">
      <div class="produto-info">
        <div class="produto-header">
          <span class="produto-icone">📦</span>
          <h3 class="produto-descricao">{{ produto.descricao }}</h3>
        </div>
        <div class="produto-body">
          <p class="produto-preco">{{ produto.preco | currencyBr }}</p>
          <span *ngIf="produto.adicional" class="badge">Adicional</span>
          <span
            class="badge"
            [ngClass]="produto.ativo ? 'success' : 'inactive'"
          >
            {{ produto.ativo ? "Ativo" : "Inativo" }}
          </span>
        </div>
      </div>

      <div class="produto-actions">
        <div class="acoes">
          <button class="btn secondary small" (click)="abrirModalEdit(produto)">
            Editar
          </button>
          <button class="btn danger small" (click)="abrirModalDelete(produto)">
            Excluir
          </button>
        </div>
      </div>
    </div>
  </div>

  <app-modal-edit
    [isOpen]="modalEditOpen"
    [title]="'Editar ' + (selectedProduto?.descricao || '')"
    (close)="fecharModais()"
    (confirm)="formEdit.valid && confirmarEdicao(formEdit.value)"
  >
    <form [formGroup]="formEdit" class="form-edit">
      <label>
        Descrição
        <input
          type="text"
          formControlName="descricao"
          placeholder="Ex: Coca-Cola 350ml"
        />
      </label>

      <label>
        Preço
        <input
          type="number"
          step="0.01"
          formControlName="preco"
          placeholder="0,00"
        />
      </label>

      <label>
        Número
        <input
          type="number"
          formControlName="numero"
          placeholder="Código interno"
        />
      </label>

      <label class="checkbox">
        <input type="checkbox" formControlName="ativo" />
        <span class="checkmark"></span>
        <span class="label-text">Produto Ativo</span>
      </label>

      <label class="checkbox">
        <input type="checkbox" formControlName="adicional" />
        <span class="checkmark"></span>
        <span class="label-text">Produto Adicional</span>
      </label>
    </form>
  </app-modal-edit>

  <app-modal-delete
    [isOpen]="modalDeleteOpen"
    (close)="fecharModais()"
    (confirm)="confirmarExclusao()"
  >
    <div *ngIf="selectedProduto">
      <p>
        Deseja realmente excluir <strong>{{ selectedProduto.descricao }}</strong
        >?
      </p>
      <p class="warning">Esta ação não pode ser desfeita!</p>
    </div>
  </app-modal-delete>
</section>
