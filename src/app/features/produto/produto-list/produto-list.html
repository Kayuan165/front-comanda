<section class="produto-list">
  <div class="status-message" *ngIf="loading">
    <mat-spinner diameter="24"></mat-spinner>
    <span>Carregando produtos...</span>
  </div>

  <div class="status-message error" *ngIf="error">
    {{ error }}
  </div>

  <div class="produtos-container" *ngIf="!loading && !error">
    <mat-card
      class="produto-card"
      *ngFor="let produto of produtos"
      [class]="'metric-card--' + (produto.ativo ? 'primary' : 'danger')"
    >
      <mat-card-content>
        <div class="produto-info">
          <div class="produto-header">
            <span class="produto-icone">📦</span>
            <h3 class="produto-descricao">{{ produto.descricao }}</h3>
          </div>
          <div class="produto-body">
            <p class="produto-preco">{{ produto.preco | currencyBr }}</p>
            <span *ngIf="produto.adicional" class="badge">Adicional</span>
            <span
              class="badge"
              [ngClass]="produto.ativo ? 'success' : 'inactive'"
            >
              {{ produto.ativo ? "Ativo" : "Inativo" }}
            </span>
          </div>
        </div>

        <div class="produto-actions">
          <div class="acoes">
            <button
              mat-button
              color="primary"
              class="small"
              (click)="abrirModalEdit(produto)"
            >
              Editar
            </button>
            <button
              mat-button
              color="warn"
              class="small"
              (click)="abrirModalDelete(produto)"
            >
              Excluir
            </button>
          </div>
        </div>
      </mat-card-content>
    </mat-card>
  </div>

  <app-modal-edit
    [isOpen]="modalEditOpen"
    [title]="'Editar ' + (selectedProduto?.descricao || '')"
    (close)="fecharModais()"
    (confirm)="formEdit.valid && confirmarEdicao(formEdit.value)"
  >
    <form [formGroup]="formEdit" class="form-edit">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Descrição</mat-label>
        <input
          matInput
          type="text"
          formControlName="descricao"
          placeholder="Ex: Coca-Cola 350ml"
        />
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Preço</mat-label>
        <input
          matInput
          type="number"
          step="0.01"
          formControlName="preco"
          placeholder="0,00"
        />
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Número</mat-label>
        <input
          matInput
          type="number"
          formControlName="numero"
          placeholder="Código interno"
        />
      </mat-form-field>

      <mat-checkbox formControlName="ativo" class="checkbox">
        Produto Ativo
      </mat-checkbox>

      <mat-checkbox formControlName="adicional" class="checkbox">
        Produto Adicional
      </mat-checkbox>
    </form>
  </app-modal-edit>

  <app-modal-delete
    [isOpen]="modalDeleteOpen"
    (close)="fecharModais()"
    (confirm)="confirmarExclusao()"
  >
    <div *ngIf="selectedProduto">
      <p>
        Deseja realmente excluir <strong>{{ selectedProduto.descricao }}</strong
        >?
      </p>
      <p class="warning">Esta ação não pode ser desfeita!</p>
    </div>
  </app-modal-delete>
</section>
